  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><span></span></div>
        <div class="brand-copy">
          <h1 id="brand-title">科研工作台</h1>
          <p id="brand-subtitle">Engineering Research Workspace</p>
        </div>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="workspace-mini" id="workspace-mini">Workspace · 初始化中</div>
        <div class="version">Standalone · <span id="version-label">v1.0</span></div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="page-heading">
          <div class="eyebrow" id="page-eyebrow">CORE WORK</div>
          <h2 id="page-title">概览</h2>
          <div class="page-date" id="page-date"></div>
        </div>
        <div class="top-actions">
          <button class="top-search-btn" id="global-search-btn" type="button" title="全局搜索 · Ctrl/⌘ K"><span>⌕</span><span>搜索</span><kbd>⌘K</kbd></button>
          <!-- v261009 · §6.3 顶栏槽位：插件（如天气）把组件画进这里，内核不认识具体功能 -->
          <span class="topbar-slot" id="topbar-slot" data-erw-slot="topbar"></span>
          <button class="icon-btn" id="theme-btn" type="button" title="切换主题">◐</button>
          <button class="density-pill" id="density-btn" type="button" title="当前：紧凑型（热力图与学业卡并排、一屏收纳免滚动）。点击切换为宽松型">紧凑型</button>
          <div class="zoom-wrap">
            <button class="zoom-pill" id="zoom-btn" type="button" title="界面缩放">100%</button>
            <div class="dropdown hidden" id="zoom-menu">
              <button type="button" data-zoom="80">80% · 紧凑</button>
              <button type="button" data-zoom="90">90% · 偏小</button>
              <button type="button" data-zoom="100">100% · 默认</button>
              <button type="button" data-zoom="110">110% · 偏大</button>
              <button type="button" data-zoom="125">125% · 宽松</button>
            </div>
          </div>
          <div class="reload-wrap">
            <button class="primary-btn reload-btn" id="reload-btn" type="button" title="重新读取所有配置并刷新本地缓存">↻ Reload</button>
            <button class="primary-btn reload-menu-btn" id="reload-menu-btn" type="button" aria-label="Reload 菜单">⌄</button>
            <div class="dropdown hidden" id="reload-menu">
              <button type="button" data-system-action="reload">Reload 全部配置</button>
              <button type="button" data-system-action="restart">快速重启服务</button>
            </div>
          </div>
        </div>
      </header>
      <main id="main" class="main-content"></main>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>
